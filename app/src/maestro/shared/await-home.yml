appId: dev.sanastasov.bybon.debug
---
# CI emulators can show a System UI ANR overlay that hides the home title.
- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn:
          id: "android:id/aerr_wait"
          label: "Dismiss ANR dialog"
- extendedWaitUntil:
    visible: "Bybon"
    timeout: 20000
- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn:
          id: "android:id/aerr_wait"
          label: "Dismiss ANR dialog after launch"
- assertVisible: "Bybon"
