appId: dev.sanastasov.bybon.debug
---
# System UI ANR dialogs can appear after launch on CI emulators and hide "Bybon".
- repeat:
    times: 20
    while:
      notVisible: "Bybon"
    commands:
      - tapOn:
          id: "android:id/aerr_wait"
          optional: true
          label: "Dismiss ANR dialog if present"
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible: "Bybon"
