appId: dev.sanastasov.bybon.debug
---
- launchApp
- assertVisible: "Bybon"
- assertVisible: "Full Body A"
- tapOn: "Start Workout"
- assertVisible: "Full body workout routine variant A"
- assertVisible: "3 x Bench Press (barbell) in 8 - 10"
- assertVisible: "Decrease weight and reps for all exercises"
- assertVisible: "Increase weight and reps for all exercises"
- assertVisible: "Reset all exercises to previous session"
- tapOn: "Increase weight and reps for Bench Press (barbell)"
- tapOn: "Decrease weight and reps for Bench Press (barbell)"
- tapOn: "Reset Bench Press (barbell) to previous session"
- tapOn: "Start Workout"
- assertVisible: "Full body workout routine variant A"
- assertVisible: "3 x Bench Press (barbell) in 8 - 10"
- tapOn:
      text: "50"
      index: 0
- eraseText
- inputText: "60"
- tapOn:
      text: "8"
      index: 1
- eraseText
- inputText: "10"
- hideKeyboard
- assertVisible: "Set 1 in progress, 60 kg by 8, @ 74.48 kg 1RM. Double tap to mark complete."
- assertVisible:
      text: "10"
      index: 0
- tapOn:
      text: "Set 1 in progress, 60 kg by 8, @ 74.48 kg 1RM. Double tap to mark complete."
      point: "90%, 50%" # Tap on the right side to avoid the TextInput
- assertVisible: "1. 60 kg x 8 @ 74.48 kg 1RM"
- assertVisible: "Set 2 in progress, 50 kg by 10, @ 66.67 kg 1RM. Double tap to mark complete."
- tapOn:
      text: "Set 2 in progress, 50 kg by 10, @ 66.67 kg 1RM. Double tap to mark complete."
      point: "90%, 50%" # Tap on the right side to avoid the TextInput
- tapOn: "Add set"
- assertVisible: "4 x Bench Press (barbell) in 8 - 10"
- tapOn: "Remove last set"
- assertVisible: "3 x Bench Press (barbell) in 8 - 10"
- swipe:
      start: 80%, 20%
      end: 20%, 20%
- assertVisible: "3 x Squat (barbell) in 8 - 10"
- assertVisible: "Exercise 2 / 6"
- assertVisible: "Set 1, 50 kg by 8, @ 62.07 kg 1RM"
- back
- assertVisible: "Active"
- assertVisible: "Open Workout"
- tapOn: "Open Workout"
- assertVisible: "3 x Bench Press (barbell) in 8 - 10"
- assertVisible: "1. 60 kg x 8 @ 74.48 kg 1RM"
- assertNotVisible: "Start Workout"
