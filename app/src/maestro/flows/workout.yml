appId: dev.sanastasov.bybon.debug
---
- launchApp:
    clearState: true
- assertVisible: "Bybon"
- assertVisible: "Full Body A"
- tapOn: "Start Workout"
- assertVisible: "Full body workout routine variant A"
- assertVisible: "3 x Barbell Bench Press in 8 - 10"
- assertVisible: "previous"
- assertVisible: "kg"
- assertVisible: "reps"
- assertVisible: "1RM"
- assertVisible: "Warmup set, 20 kg by 8"
- assertVisible: "Decrease weight and reps for all exercises"
- assertVisible: "Increase weight and reps for all exercises"
- assertVisible: "Decrease weight and reps for Barbell Bench Press"
- assertVisible: "Increase weight and reps for Barbell Bench Press"
- assertVisible: "More options for Barbell Bench Press"
- tapOn: "More options for Barbell Bench Press"
- assertVisible: "Move Barbell Bench Press up"
- assertVisible: "Move Barbell Bench Press down"
- tapOn: "Move Barbell Bench Press down"
- scrollUntilVisible:
    element: "More options for Barbell Back Squat"
    direction: UP
- tapOn: "More options for Barbell Back Squat"
- tapOn: "Move Barbell Back Squat down"
- scrollUntilVisible:
    element: "Increase weight and reps for Barbell Bench Press"
    direction: UP
- assertNotVisible: "Reset all exercises to previous session"
- assertNotVisible: "Reset all sets to previous session"
- assertNotVisible: "Reset set to previous session"
- tapOn: "Increase weight and reps for Barbell Bench Press"
- tapOn: "Decrease weight and reps for Barbell Bench Press"
- tapOn: "Start Workout"
- assertVisible: "Full body workout routine variant A"
- assertVisible: "3 x Barbell Bench Press in 8 - 10"
- assertVisible: "previous"
- assertVisible: "kg"
- assertVisible: "reps"
- assertVisible: "1RM"
- assertVisible: "Warmup set in progress, 20 kg by 8"
- tapOn: "Mark Warmup set complete"
- tapOn: "Mark Warmup set complete"
- tapOn: "Mark Warmup set complete"
- assertVisible: "Set 1 in progress, 50 kg by 8, @ 62.07 kg 1RM"
# hideKeyboard uses Back when the IME is already gone, which pops the session to Main.
# Wait on the unique set description before unfocusing: erase+input is flaky,
# and leaving the field while it is empty commits a blank weight.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
            text: "Set 1 weight"
            point: "90%, 50%" # Cursor at end so backspace clears both digits
      - eraseText: 8
      - inputText: "60"
      - extendedWaitUntil:
            visible: "Set 1 in progress, 60 kg by 8, @ 74.48 kg 1RM"
            timeout: 5000
- retry:
    maxRetries: 3
    commands:
      # Center tap: 90% of the reps a11y node sits on the 1RM cell.
      - tapOn: "Set 1 reps"
      - eraseText: 8
      - inputText: "10"
      - extendedWaitUntil:
            visible: "Set 1 in progress, 60 kg by 10, @ 80 kg 1RM"
            timeout: 5000
- tapOn: "Full body workout routine variant A"
- assertVisible: "Set 1 in progress, 60 kg by 10, @ 80 kg 1RM"
- tapOn: "Mark Set 1 complete"
- assertVisible: "1. 60 kg x 10 @ 80 kg 1RM"
- assertVisible: "Set 2 in progress, 50 kg by 8, @ 62.07 kg 1RM"
- tapOn: "Mark Set 2 complete"
- tapOn: "Add set"
- assertVisible: "4 x Barbell Bench Press in 8 - 10"
- tapOn: "Remove last set"
- assertVisible: "3 x Barbell Bench Press in 8 - 10"
- swipe:
      start: 80%, 20%
      end: 20%, 20%
- assertVisible: "3 x Barbell Back Squat in 8 - 10"
- assertVisible: "Exercise 2 / 6"
- assertVisible: "Set 1, 50 kg by 8, @ 62.07 kg 1RM"
- back
- assertVisible: "Active"
- assertVisible: "Open Workout"
- tapOn: "Open Workout"
- assertVisible: "3 x Barbell Bench Press in 8 - 10"
- assertVisible: "1. 60 kg x 10 @ 80 kg 1RM"
- assertVisible: "Exercise 1 / 6"
- assertNotVisible: "Start Workout"
- assertVisible: "Set 3 in progress, 50 kg by 8, @ 62.07 kg 1RM"
- tapOn: "Mark Set 3 complete"
- assertVisible: "3 x Barbell Back Squat in 8 - 10"
- assertVisible: "Exercise 2 / 6"
- back
- tapOn: "Open Workout"
- assertVisible: "3 x Barbell Back Squat in 8 - 10"
- assertVisible: "Exercise 2 / 6"
- assertNotVisible: "3 x Barbell Bench Press in 8 - 10"
- assertNotVisible: "Start Workout"
