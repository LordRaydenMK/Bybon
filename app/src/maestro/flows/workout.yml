appId: dev.sanastasov.bybon.debug
---
- launchApp
- assertVisible: "Bybon"
- assertVisible: "Full Body A"
- tapOn: "Start Workout"
- assertVisible: "Full body workout routine variant A"
- assertVisible: "3 x Bench Press (barbell) in 8 - 10"
- assertVisible: "previous"
- assertVisible: "kg"
- assertVisible: "reps"
- assertVisible: "1RM"
- assertVisible: "Warmup set, 20 kg by 8"
- assertVisible: "Decrease weight and reps for all exercises"
- assertVisible: "Increase weight and reps for all exercises"
- assertVisible: "Decrease weight and reps for Bench Press (barbell)"
- assertVisible: "Increase weight and reps for Bench Press (barbell)"
- assertNotVisible: "Reset all exercises to previous session"
- assertNotVisible: "Reset all sets to previous session"
- assertNotVisible: "Reset set to previous session"
- tapOn: "Increase weight and reps for Bench Press (barbell)"
- tapOn: "Decrease weight and reps for Bench Press (barbell)"
- tapOn: "Start Workout"
- assertVisible: "Full body workout routine variant A"
- assertVisible: "3 x Bench Press (barbell) in 8 - 10"
- assertVisible: "previous"
- assertVisible: "kg"
- assertVisible: "reps"
- assertVisible: "1RM"
- assertVisible: "Warmup set in progress, 20 kg by 8. Double tap to mark complete."
- tapOn:
    text: "Warmup set in progress, 20 kg by 8. Double tap to mark complete."
    point: "90%, 50%" # Tap on the right side to avoid the TextInput
- tapOn:
    text: "Warmup set in progress, 20 kg by 4. Double tap to mark complete."
    point: "90%, 50%"
- tapOn:
    text: "Warmup set in progress, 20 kg by 3. Double tap to mark complete."
    point: "90%, 50%"
- assertVisible: "Set 1 in progress, 50 kg by 8, @ 62.07 kg 1RM. Double tap to mark complete."
- tapOn:
      text: "50"
      index: 0
      point: "90%, 50%" # Select-all on focus; eraseText still clears the value
- eraseText: 8
- inputText: "60"
- tapOn:
      text: "8"
      index: 1
      point: "90%, 50%"
- eraseText: 8
- inputText: "10"
- hideKeyboard
- assertVisible: "Set 1 in progress, 60 kg by 10, @ 80 kg 1RM. Double tap to mark complete."
- assertVisible:
      text: "10"
      index: 0
- tapOn:
    text: "Set 1 in progress, 60 kg by 10, @ 80 kg 1RM. Double tap to mark complete."
    point: "90%, 50%" # Tap on the right side to avoid the TextInput
- assertVisible: "1. 60 kg x 10 @ 80 kg 1RM"
- assertVisible: "Set 2 in progress, 50 kg by 8, @ 62.07 kg 1RM. Double tap to mark complete."
- tapOn:
      text: "Set 2 in progress, 50 kg by 8, @ 62.07 kg 1RM. Double tap to mark complete."
      point: "90%, 50%" # Tap on the right side to avoid the TextInput
- tapOn: "Add set"
- assertVisible: "4 x Bench Press (barbell) in 8 - 10"
- tapOn: "Remove last set"
- assertVisible: "3 x Bench Press (barbell) in 8 - 10"
- tapOn:
    text: "Set 3 in progress, 50 kg by 8, @ 62.07 kg 1RM. Double tap to mark complete."
    point: "90%, 50%"
- extendedWaitUntil:
    visible: "Exercise 2 / 6"
    timeout: 5000
- assertVisible: "3 x Squat (barbell) in 8 - 10"
- assertVisible: "Warmup set in progress, 20 kg by 8. Double tap to mark complete."
- assertVisible: "Set 1, 50 kg by 8, @ 62.07 kg 1RM"
- back
- assertVisible: "Active"
- assertVisible: "Open Workout"
- tapOn: "Open Workout"
- assertVisible: "3 x Bench Press (barbell) in 8 - 10"
- assertVisible: "1. 60 kg x 10 @ 80 kg 1RM"
- assertNotVisible: "Start Workout"
