appId: dev.sanastasov.bybon.debug
---
- launchApp:
    clearState: true
- assertVisible: "Bybon"
- extendedWaitUntil:
    visible: "Full Body A"
    timeout: 30000
- extendedWaitUntil:
    visible: "Full Body B"
    timeout: 30000
- tapOn: "More options for Full Body B"
- assertVisible: "Move Full Body B up"
- assertVisible: "Move Full Body B down"
- tapOn: "Move Full Body B up"
- assertVisible:
    text: "Full Body A"
    below:
      text: "Full Body B"
- tapOn: "More options for Full Body B"
- tapOn: "Move Full Body B down"
- assertVisible:
    text: "Full Body B"
    below:
      text: "Full Body A"
