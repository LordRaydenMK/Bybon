appId: dev.sanastasov.bybon.debug
---
- launchApp
- runFlow: ../shared/await-home.yml
- assertVisible: "Full Body A"
- tapOn: "More options for Full Body A"
- tapOn: "Edit Plan"
- assertVisible: "Edit plan"
- assertVisible: "Full Body A"
- assertVisible: "Full body workout routine variant A"
- assertVisible: "Bench Press (barbell)"
- assertVisible: "Chest · Barbell"
- assertVisible: "Bench Press (barbell) warmup set"
- assertVisible: "Bench Press (barbell) set 1, 8–10 reps, rest 2:00"
- assertVisible: "Add set to Bench Press (barbell)"
- assertVisible: "Remove last set from Bench Press (barbell)"
- assertVisible: "More options for Bench Press (barbell)"
- tapOn: "More options for Bench Press (barbell)"
- assertVisible: "Move Bench Press (barbell) up"
- assertVisible: "Move Bench Press (barbell) down"
- tapOn: "Move Bench Press (barbell) down"
- assertVisible: "Squat (barbell)"
- tapOn: "More options for Squat (barbell)"
- tapOn: "Move Squat (barbell) down"
- assertVisible: "Bench Press (barbell)"
- tapOn: "Add set to Bench Press (barbell)"
- scrollUntilVisible:
    element: "Bench Press (barbell) set 4, 8–10 reps, rest 2:00"
    direction: DOWN
    centerElement: true
- assertVisible: "Bench Press (barbell) set 4, 8–10 reps, rest 2:00"
- tapOn: "Remove last set from Bench Press (barbell)"
- assertNotVisible: "Bench Press (barbell) set 4, 8–10 reps, rest 2:00"
- tapOn: "Remove last set from Bench Press (barbell)"
- tapOn: "Remove last set from Bench Press (barbell)"
- assertNotVisible: "Bench Press (barbell) set 2, 8–10 reps, rest 2:00"
- assertVisible: "Remove Bench Press (barbell) from plan"
- tapOn: "Add set to Bench Press (barbell)"
- tapOn: "Add set to Bench Press (barbell)"
- assertVisible: "Remove last set from Bench Press (barbell)"
- scrollUntilVisible:
    element: "Bench Press (barbell) set 3, 8–10 reps, rest 2:00"
    direction: DOWN
    centerElement: true
- assertVisible: "Bench Press (barbell) set 3, 8–10 reps, rest 2:00"
- scrollUntilVisible:
    element: "Squat (barbell)"
    direction: DOWN
    centerElement: true
- assertVisible: "Squat (barbell)"
- scrollUntilVisible:
    element: "Leg Curl (machine) set 1, 12–14 reps, rest 1:30"
    direction: DOWN
    centerElement: true
- assertVisible: "Leg Curl (machine)"
- assertVisible: "Legs · Machine"
- assertVisible: "Leg Curl (machine) set 1, 12–14 reps, rest 1:30"
- scrollUntilVisible:
    element: "Add Exercise"
    direction: DOWN
- assertVisible: "Add Exercise"
- tapOn: "Add Exercise"
- assertVisible: "Exercise Library"
- assertVisible: "In plan Full Body A"
- assertVisible: "Bench Press (barbell)"
- assertVisible: "Arms"
- assertVisible: "Dumbbell"
- assertVisible: "Add exercise"
- tapOn:
    text: "Arms"
    index: 0
- tapOn:
    text: "Dumbbell"
    index: 0
- scrollUntilVisible:
    element: "Select Incline Curl (dumbbell)"
    direction: DOWN
- tapOn: "Select Incline Curl (dumbbell)"
- scrollUntilVisible:
    element: "Deselect Incline Curl (dumbbell)"
    direction: UP
- tapOn: "Add exercise"
- assertVisible: "Edit plan"
- scrollUntilVisible:
    element: "Incline Curl (dumbbell)"
    direction: DOWN
    centerElement: true
- assertVisible: "Incline Curl (dumbbell)"
- assertVisible: "Arms · Dumbbell"
- assertVisible: "Incline Curl (dumbbell) set 1, 8–12 reps, rest 1:00"
- assertVisible: "More options for Incline Curl (dumbbell)"
- tapOn: "More options for Incline Curl (dumbbell)"
- tapOn: "Remove Exercise"
- assertNotVisible: "Incline Curl (dumbbell)"
- scrollUntilVisible:
    element: "Archive Plan"
    direction: DOWN
- tapOn: "Back"
- assertVisible: "Bybon"
- assertVisible: "Start Workout"
