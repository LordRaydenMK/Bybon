appId: dev.sanastasov.bybon.debug
---
- launchApp
- assertVisible: "Bybon"
- assertVisible: "Full Body A"
- tapOn: "More options for Full Body A"
- tapOn: "Edit Plan"
- assertVisible: "Edit plan"
- assertVisible: "Full Body A"
- assertVisible: "Full body workout routine variant A"
- assertVisible: "Bench Press (barbell)"
- assertVisible: "Chest · Barbell"
- assertVisible: "Bench Press (barbell) warmup set"
- assertVisible: "Bench Press (barbell) set 1, 8–10 reps, rest 2:00"
- assertVisible: "Archive Plan"
- scrollUntilVisible:
    element: "Squat (barbell)"
    direction: DOWN
- assertVisible: "Squat (barbell)"
- scrollUntilVisible:
    element: "Leg Curl (machine)"
    direction: DOWN
- assertVisible: "Leg Curl (machine)"
- assertVisible: "Leg Curl (machine) set 1, 12–14 reps, rest 1:30"
- tapOn: "Back"
- assertVisible: "Bybon"
- assertVisible: "Start Workout"
