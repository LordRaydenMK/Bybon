name: Release

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Common setup
        uses: ./.github/actions/setup-android

      - name: Build
        run: ./gradlew buildDebug



  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAESTRO_VERSION: "2.12.1"
      MAESTRO_CLI_NO_ANALYTICS: "true"
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Common setup
        uses: ./.github/actions/setup-android
        with:
          enable-kvm: true

      - name: Cache Maestro CLI
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: maestro-cli-${{ env.MAESTRO_VERSION }}-${{ runner.os }}

      - name: Install Maestro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/install-maestro.sh
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Create debug APK
        run: ./gradlew assembleDebug

      - name: Run Maestro E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash .github/scripts/prepare-emulator-for-e2e.sh
            ./gradlew installDebug
            bash .github/scripts/seed-strong-csv.sh
            maestro test app/src/maestro/flows

      - name: Archive Maestro test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-test-results
          path: ~/.maestro/tests/*/

  assemble-release:
    needs:
      - build
      - e2e-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Common setup
        uses: ./.github/actions/setup-android

      - name: Set version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)

          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=0.${{ github.run_number }}-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Setup secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
          echo "bybon_ks_pass=${{ secrets.KEYSTORE_PASS }}" >> keystore.properties
          echo "bybon_key_alias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "bybon_key_pass=${{ secrets.KEY_PASS }}" >> keystore.properties

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Archive APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          archive: false

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            app/build/outputs/apk/release/*.apk

