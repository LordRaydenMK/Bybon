name: PR / main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Common setup
        uses: ./.github/actions/setup-android

      - name: Detekt
        run: ./gradlew detekt

      - name: Build
        run: ./gradlew buildDebug assembleDebug

      - name: Archive debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          archive: false
          retention-days: ${{ github.ref == 'refs/heads/main' && 7 || 3 }}
          if-no-files-found: error

  firebase-emulator-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      actions: write
      pull-requests: read
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect firebase image changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            firebase:
              - 'firebase/**'

      - name: Resolve image
        id: image
        env:
          FIREBASE_CHANGED: ${{ steps.changes.outputs.firebase }}
        run: |
          set -euo pipefail
          image_repo="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/firebase-emulator"
          if [ "$FIREBASE_CHANGED" = "true" ]; then
            echo "image=${image_repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
            tags="${image_repo}:${GITHUB_SHA}"
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              tags="${tags},${image_repo}:latest"
            fi
            echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${image_repo}:latest" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image.outputs.push == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.image.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Firebase emulator image
        if: steps.image.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: firebase
          file: firebase/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-test:
    needs: firebase-emulator-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    services:
      firebase-emulator:
        image: ${{ needs.firebase-emulator-image.outputs.image }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 4400:4400
          - 8080:8080
          - 9099:9099
          - 9150:9150
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:4400/emulators | grep -q '\"auth\"' && curl -sf http://127.0.0.1:4400/emulators | grep -q '\"firestore\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 40s

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Smoke Firebase emulator
        run: python3 .github/scripts/smoke-firebase-emulator.py

      - name: Common setup
        uses: ./.github/actions/setup-android
        with:
          enable-kvm: true

      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro

      - name: Create debug APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run instrumented and Maestro E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash .github/scripts/prepare-emulator-for-e2e.sh
            ./gradlew connectedDebugAndroidTest
            ./gradlew installDebug
            bash .github/scripts/seed-strong-csv.sh
            maestro test app/src/maestro/flows

      - name: Archive Android instrumented test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-test-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/

      - name: Archive Maestro test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-test-results
          path: ~/.maestro/tests/*/
