name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Common setup
        uses: ./.github/actions/setup-android

      - name: Detekt
        run: ./gradlew detekt

      - name: Build
        run: ./gradlew buildDebug

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Common setup
        uses: ./.github/actions/setup-android
        with:
          enable-kvm: true

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Create debug APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run instrumented and Maestro E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest
            ./gradlew installDebug
            bash .github/scripts/seed-strong-csv.sh
            maestro test app/src/maestro/flows

      - name: Archive Android instrumented test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-test-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/

      - name: Archive Maestro test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-test-results
          path: ~/.maestro/tests/*/
